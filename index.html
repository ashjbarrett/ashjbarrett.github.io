<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ash Barrett</title>
  <link rel="icon" type="image/jpeg" href="image.jpeg">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&display=swap">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: #000;
      color: #fff;
      font: 14px/1.5 "IBM Plex Mono", monospace;
    }

    main { position: relative; }

    .cursor-glow {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      opacity: 0;
      transition: opacity 240ms ease;
    }

    .cursor-glow::before {
      content: "";
      position: absolute;
      left: -90px;
      top: -90px;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgb(255 255 255 / 18%), transparent 70%);
      transform: translate(var(--x, 0px), var(--y, 0px));
    }

    .cursor-glow.visible { opacity: 1; }

    @media (prefers-reduced-motion: reduce) {
      .cursor-glow { display: none; }
    }

    nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(6px, 2vw, 24px);
    }

    a {
      padding-block: 12px;
      color: inherit;
      text-decoration: none;
      white-space: nowrap;
    }

    a:hover, a:focus-visible {
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .short { display: none; }

    @media (max-width: 760px) {
      .full { display: none; }
      .short { display: inline; }
      nav { font-size: clamp(12px, 3.5vw, 14px); }
    }
  </style>
</head>
<body>
  <div class="cursor-glow" aria-hidden="true"></div>
  <main>
    <nav aria-label="Ash Barrett's profiles and contact information">
      <a href="https://x.com/ashbarrettt">X</a>
      <a href="https://substack.com/@ashjbarrett">Substack</a>
      <a href="https://www.linkedin.com/in/ash-barrett/">LinkedIn</a>
      <a href="mailto:ashjbarrett@gmail.com" aria-label="Gmail: ashjbarrett@gmail.com"><span class="full">ashjbarrett@gmail.com</span><span class="short">Gmail</span></a>
      <a href="mailto:ashbarrett@ucla.edu" aria-label="UCLA email: ashbarrett@ucla.edu"><span class="full">ashbarrett@ucla.edu</span><span class="short">UCLA</span></a>
      <a href="tel:+19132938404" aria-label="Phone: 913-293-8404"><span class="full">913-293-8404</span><span class="short">Phone</span></a>
    </nav>
  </main>
  <script>
    const glow = document.querySelector(".cursor-glow");
    function hideGlow() {
      glow.classList.remove("visible");
    }

    window.addEventListener("pointermove", (event) => {
      if (event.pointerType !== "mouse") {
        hideGlow();
        return;
      }
      glow.style.setProperty("--x", event.clientX + "px");
      glow.style.setProperty("--y", event.clientY + "px");
      glow.classList.add("visible");
    });
    document.documentElement.addEventListener("pointerleave", hideGlow);
    window.addEventListener("blur", hideGlow);
  </script>
</body>
</html>
