<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ash Barrett</title>
  <link rel="icon" type="image/jpeg" href="image.jpeg">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 14px;
      line-height: 1.8;
      color: #111;
      background-color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      max-width: 720px;
      margin: 0 auto;
      padding: 0 20px;
    }

    nav {
      text-align: center;
      margin-top: 40px;
      letter-spacing: 0.02em;
    }

    nav a {
      position: relative;
      color: #000;
      text-decoration: none;
      margin: 0 20px;
      font-weight: 400;
      text-transform: lowercase;
      transition: color 0.2s ease;
    }

    nav a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -2px;
      width: 0%;
      height: 1px;
      background-color: #000;
      transition: width 0.25s ease-in-out;
    }

    nav a:hover::after {
      width: 100%;
    }

    nav a.active {
      font-weight: 600;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    a {
      color: #0055ff;
      text-decoration: none;
      font-weight: 500;
      position: relative;
    }

    a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -1px;
      width: 0%;
      height: 1px;
      background-color: #0055ff;
      transition: width 0.25s ease-in-out;
    }

    a:hover::after {
      width: 100%;
    }

    p {
      margin: 14px 0;
    }

    ul {
      margin: -4px 0 12px 20px;
      padding: 0;
    }

    li {
      margin-bottom: 3px;
    }

    .final-line {
      margin-top: 1rem;
      text-align: center;
      font-style: italic;
    }

    .smile {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      margin: 0;
      font-size: clamp(80px, 15vw, 144px);
      line-height: 1;
    }

    /* === FOOTER === */
    footer {
      text-align: center;
      border-top: 1px solid #ccc;
      padding-top: 14px;
      line-height: 1.8;
      margin-bottom: 10px;
    }

    .footer-line {
      margin: 4px 0;
    }

    .footer-line a,
    .footer-line span {
      color: #111;
      text-decoration: none;
      font-weight: 500;
      position: relative;
      margin: 0 8px;
    }

    .footer-line a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -1px;
      width: 0%;
      height: 1px;
      background-color: #111;
      transition: width 0.25s ease-in-out;
    }

    .footer-line a:hover::after {
      width: 100%;
    }
  </style>
</head>
<body>


  <main>
    <p class="smile">:)</p>
  </main>

  <footer>
    <div class="footer-line">
      <a href="https://x.com/ashbarrettt">X</a> |
      <a href="https://substack.com/@ashjbarrett">Substack</a> |
      <a href="https://www.linkedin.com/in/ash-barrett/">LinkedIn</a>
    </div>

    <div class="footer-line">
      <a href="mailto:ashjbarrett@gmail.com">ashjbarrett@gmail.com</a> |
      <a href="mailto:ashbarrett@ucla.edu">ashbarrett@ucla.edu</a>
    </div>

    <div class="footer-line">
      <span>913-293-8404</span>
    </div>
  </footer>

</body>
</html>
